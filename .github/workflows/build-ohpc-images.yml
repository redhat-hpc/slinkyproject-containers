name: Build OpenHPC-based Slurm images

env:
  REGISTRY: quay.io/slinky-on-openshift
  PARENT_IMAGE: quay.io/centos/centos:stream9
  BAKE_IMPORTS: --file docker-bake.hcl --file ${{ github.event.inputs.version }}/rockylinux9/slurm.hcl --set *.args.linux_flavor=centos9-ohpc

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The slurm-cluster-operator version to build and release"
        required: true
        type: choice
        default: "25.11"
        options:
          - "25.05"
          - "25.11"
      target:
        description: "the bake target"
        required: true
        type: choice
        default: "cuda"
        options:
          - "cuda"
          - "core"
  # push:
  #   branches: [ "main" ]

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - uses: mathio/gha-cleanup@v1
        with:
          remove-browsers: true
          verbose: true

      - name: Patch HCL flavor
        # We target the specific file based on the input version
        run: |
          FILE_PATH="schedmd/slurm/${{ github.event.inputs.version }}/rockylinux9/slurm.hcl"
          echo "Patching $FILE_PATH..."
          sed -i 's/linux_flavor = "rockylinux9"/linux_flavor = "centos9-ohpc"/g' "$FILE_PATH"

      - name: Build images with docker buildx
        run: |
          cd ./schedmd/slurm
          docker buildx bake ${{ env.BAKE_IMPORTS }} --print ${{ github.event.inputs.target }}
          docker buildx bake ${{ env.BAKE_IMPORTS }} --progress=plain --push ${{ github.event.inputs.target }}
